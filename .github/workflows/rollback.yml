name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Git tag to rollback to, for example v1"
        required: true
        default: "v1"

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Show rollback version
        run: echo "Rolling back to ${{ github.event.inputs.version }}"

      - name: Build Docker image from selected version
        run: docker build -t my-node-app:${{ github.event.inputs.version }} .

      - name: Run rollback container
        run: docker run -d --name my-node-app -p 3000:3000 my-node-app:${{ github.event.inputs.version }}

      - name: Wait for application startup
        run: sleep 10

      - name: Show container logs
        run: docker logs my-node-app

      - name: Verify rollback health
        run: curl --fail http://localhost:3000/health

      - name: Confirm rollback
        run: echo "Rollback to ${{ github.event.inputs.version }} completed successfully"