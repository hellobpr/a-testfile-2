name: Node.js CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Install dependencies
        run: npm install

      - name: 4. Run application
        run: node index.js