name: Node.js CI

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 3. Print Node.js version
        run: node -v

      - name: 4. Install dependencies
        run: npm install

      - name: 5. Run tests
        run: npm test

      - name: 6. Run application
        run: node index.js